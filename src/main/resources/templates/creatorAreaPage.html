<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" href="/style.css">

	<title>OBlog | Área do criador</title>
</head>

<body class="bg-dark text-white">


	<nav class="navbar navbar-dark bg-dark p-3 border-bottom border-secondary">
		<a class="navbar-brand fw-bold">OBlog | <span class="fw-light"
				th:text="${userName} ? ${userName} : 'Username' "></span></a>
		<div>
			<form>
				<div class="d-flex flex-direction-inline gap-3">
					<input class="form-control" type="text" placeholder="Pesquisar postagens" th:name="pesquisar">
					<button class="btn btn-light" type="reset"><i class="fa-solid fa-search text-dark"></i></button>
				</div>
			</form>
		</div>
	</nav>

	<main class="p-3 mt-3">
		<a type="button" class="btn btn-success btn-sm" th:href="@{/creatorArea/newArticle}"><i class="fa-solid fa-plus"></i> NOVA
			POSTAGEM</a>
		<div class="row mt-5">
			<div class="col-12 col-lg-2">
				<ul class="nav flex-column mb-5">
					<li class="nav-item">
						<a class="nav-link text-white" href="#"><i class="fa-solid fa-newspaper"></i> Postagens</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-white" href="#"><i class="fa-solid fa-comment"></i> Comentários</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-white" href="#"><i class="fa-solid fa-gear"></i> Configurações</a>
					</li>
					<li class="nav-item">
						<form th:action="@{/logout}" method="post" style="display: inline;">
							<button type="submit" class="btn btn-link text-danger text-decoration-none"><i
									class="fa-solid fa-right-from-bracket"></i> Logout</button>
						</form>

					</li>
				</ul>
			</div>
			<div class="col-12 col-lg-10">
				<div class="container">

					<div th:each="article : ${articles}" class="card mb-3"> <!--- Um modelo de como será o card-->
						<div class="card-body d-flex flex-column flex-lg-row justify-content-between">
							<div class="gap-0">
								<p class="text-dark fw-bold fs-5" th:text="${article.title}"></p>
								<p class="text-muted fw-bold fs-6" th:text="${article.autor.name}"></p>
							</div>
							<div class="d-flex flex-row gap-3 align-items-center">
								<p class="text-muted"
									th:text="${#temporals.format(article.creationDate, 'dd/MM/yyyy')}"></p>
								<p class="text-muted">1 <i class="fa-solid fa-comment"></i></p>
								<p class="text-muted">1 <i class="fa-solid fa-eye"></i></p>
							</div>
						</div>
					</div>

					<!---Paginação-->
					<nav aria-label="Page navigation">
						<ul class="pagination justify-content-center">

							<!-- Botão "Anterior" -->
							<li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
								<a class="page-link" th:href="@{/creatorArea(page=${currentPage - 1})}">Anterior</a>
							</li>

							<!-- Números das páginas -->
							<li th:if="${totalPages >=1}" class="page-item"
								th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
								th:classappend="${i == currentPage} ? 'active'">
								<a class="page-link" th:href="@{|/creatorArea?page=${i}|}" th:text="${i + 1}">1</a>
							</li>

							<!-- Botão "Próximo" -->
							<li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
								<a class="page-link" th:href="@{/creatorArea(page=${currentPage + 1})}">Próximo</a>
							</li>

						</ul>
					</nav>


				</div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>



</body>

</html>
