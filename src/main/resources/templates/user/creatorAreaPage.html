<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" href="/style.css">

	<title>OBlog | Área do criador</title>
</head>

<body class="bg-dark text-white">

	<nav class="navbar navbar-dark bg-dark p-3 border-bottom border-secondary">
		<a class="navbar-brand fw-bold">OBlog | <span class="fw-light"
				th:text="${userName} ? ${userName} : 'Username' "></span></a>
		<div>
			<form th:action="@{/creatorArea}" method="get">
				<div class="d-flex flex-direction-inline gap-3">
					<input class="form-control" type="text" placeholder="Pesquisar publicações" th:name="title"
						th:value="${title == 'ALL'} ? '' : ${title}">
					<button class="btn btn-light" type="submit"><i class="fa-solid fa-search text-dark"></i></button>
				</div>
			</form>
		</div>
	</nav>

	<main class="p-3 mt-3">

		<a type="button" class="btn btn-success btn-sm" th:href="@{/creatorArea/newArticle}">
			<i class="fa-solid fa-plus"></i> NOVA POSTAGEM</a>

		<div class="row mt-5">
			<div class="col-12 col-lg-2">
				<ul class="nav flex-column mb-5">
					<li class="nav-item">
						<a class="nav-link text-white" href="#"><i class="fa-solid fa-newspaper"></i> Publicações</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-white" href="#"><i class="fa-solid fa-comment"></i> Comentários</a>
					</li>
					<li class="nav-item">
						<a class="nav-link text-white" href="#"><i class="fa-solid fa-gear"></i> Configurações</a>
					</li>
					<li class="nav-item">
						<form th:action="@{/logout}" method="post" style="display: inline;">
							<button type="submit" class="btn btn-link text-danger text-decoration-none"><i
									class="fa-solid fa-right-from-bracket"></i> Logout</button>
						</form>
					</li>
				</ul>
			</div>

			<div class="col-12 col-lg-10">
				<div class="container">
					<div th:if="${message}"
						class="alert alert-danger alert-dimissible fade show d-flex flex-row justify-content-between"
						role="alert">
						<p th:text="${message}"></p>
						<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
					</div>
					<a class="mb-3 text-decoration-none" href="/creatorArea">Buscar todos</a>
					<div th:each="article : ${articles}" class="card mb-3 mt-3"> <!--- Um modelo de como será o card-->
						<div class="card-body d-flex flex-column flex-lg-row justify-content-between">
							<div class="gap-0">
								<div class="d-flex flex-row gap-3 align-items-center">
									<a class="link text-decoration-none"
										th:href="@{/creatorArea/article/{id}(id = ${article.id})}">
										<p class="text-dark fw-bold fs-5" th:text="${article.title}"></p>
									</a>
									<p class="text-dark fw-ligth fs-6" th:text=" '- Por ' + ${article.autor}"></p>
								</div>
								<div class="d-flex flex-row gap-5">
									<p class="text-muted"
										th:text="'Publicada - '+ ${#temporals.format(article.creationDate, 'dd/MM/yyyy HH:mm')}">
									</p>
									<p class="text-muted">1 <i class="fa-solid fa-comment"></i></p>
								</div>
							</div>
							<div class="d-flex flex-row gap-3 align-items-center">
								
								<a th:href="@{/creatorArea/article/edit/{id} (id = ${article.id})}"
									class="btn btn-primary btn-sm"><i
										class="fa-solid fa-edit"></i></a>
								
										<a th:href="@{/creatorArea/article/delete/{id} (id = ${article.id})}"
									class="btn btn-danger btn-sm"
									onclick="return confirm('Tem certeza que deseja excluir este artigo?');"><i
										class="fa-solid fa-trash"></i></a>
							</div>
						</div>
					</div>

					<!---Paginação-->
					<nav aria-label="Page navigation">
						<ul class="pagination justify-content-center">

							<!-- Botão "Anterior" -->
							<li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
								<a class="page-link" th:href="@{/creatorArea(page=${currentPage - 1})}">Anterior</a>
							</li>

							<!-- Números das páginas -->
							<li th:if="${totalPages >=1}" class="page-item"
								th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
								th:classappend="${i == currentPage} ? 'active'">
								<a class="page-link" th:href="@{|/creatorArea?page=${i}&title=${title}|}"
									th:text="${i + 1}">1</a>
							</li>

							<!-- Botão "Próximo" -->
							<li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
								<a class="page-link" th:href="@{/creatorArea(page=${currentPage + 1})}">Próximo</a>
							</li>

						</ul>
					</nav>
				</div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>



</body>

</html>
