<!DOCTYPE html>
<html lang="pt-br">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<script src="https://cdn.tiny.cloud/1/vkf0l2o06g96ojqn7vjddxpm494jad7zkmwew0scuoqvxtok/tinymce/7/tinymce.min.js"
		referrerpolicy="origin"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

	<title>OBlog | Editar publicação</title>

</head>

<body class="bg-dark text-white">

	<nav class="navbar navbar-dark bg-dark p-3 border-bottom border-secondary">
		<a class="navbar-brand fw-bold" href="/creatorArea">OBlog | <span class="fw-light"
				th:text="${userName} ? ${userName} : 'Username' "></span></a>
	</nav>


	<div class="container">

		<div class="row d-flex justify-content-center">

			<h1 class="mt-3 text-center">Editar Artigo</h1>
			<form th:action="@{/creatorArea/article/edit}" method="post" th:object="${articleDto}">

				<div class="form-group">
					<input type="text" class="form-control" id="id" th:name="id" th:value="${articleDto.id}" hidden>
				</div>
				<div class="form-group">
					<label for="titulo">Título</label>
					<input type="text" class="form-control" id="titulo" th:name="title" th:value="${articleDto.title}" required>
				</div>

				<div class="form-group mt-3">
					<label for="conteudo">Conteúdo</label>
					<textarea class="form-control" id="editor" name="content" th:text="${articleDto.content}"></textarea>
				</div>

				<button type="submit" class="btn btn-primary btn-sm mt-3 mb-5">Publicar</button>
			</form>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>

	<script>
		tinymce.init({
			selector: '#editor',
			plugins: 'lists link image code', // não inclui 'textcolor' ou 'font'
			toolbar: 'undo redo | styles | bold italic | bullist numlist | link image | code',
			menubar: false, // esconde o menu (File, Edit, View etc)
			branding: false, // remove "Powered by TinyMCE"
		});
	</script>


</body>

</html>
