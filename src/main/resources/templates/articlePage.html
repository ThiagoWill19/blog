<!DOCTYPE html>
<html lang="pt-br" xmlns="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<link rel="stylesheet" href="/style.css">

	<title>OBlog | Publicação</title>
</head>

<body class="bg-dark text-white">


	<nav class="navbar navbar-dark bg-dark p-3 border-bottom border-secondary">
		<a href="/creatorArea" class="navbar-brand fw-bold">OBlog | <span class="fw-light"
				th:text="${article.autor} ? ${article.autor} : 'Username' "></span></a>
	</nav>

	<main class=" mt-5 ms-5">
		<div class="container d-flex flex-column justify-content-center align-items-start border-start">
			<div class="d-flex flex-row gap-3">
				<a class="text-decoration-none" href="/creatorArea"><p class="fw-light" th:text="${article.autor}"></p></a>
				<p class="fw-light" th:text="' - ' + ${#temporals.format(article.creationDate, 'dd/MM/yyyy HH:mm')}"></p>
			</div>
			<h1 class="mb-5" th:text="${article.title}"></h1>
			<div th:utext="${article.content}">
				
			</div>
		</div>
		
		
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>



</body>

</html>
