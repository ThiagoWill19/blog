<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

	<title>OBlog | Registrar</title>

</head>

<body class="bg-dark text-white">
	
	<nav class="navbar navbar-dark bg-dark p-3">
		<a class="nav-item text-white fw-bold text-decoration-none" href="/artigos">Home</a>
	</nav>

	<div class="container">

		<div class="row d-flex justify-content-center">

			<h1 class="mt-5 mb-5 text-center">OBlog</h1>

			<div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-5" role="alert">
				<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="close"></button>
				<p th:text="${error}" class="d-inline-block mb-0"></p>
			</div>

			<p class="text-center">Criar uma conta</p>
			<div class="col-12 col-lg-6">
				<form class="form" th:action="@{/user}" th:object="${newUser}" method="post"
					onsubmit="return validarSenhas()">

					<div class="form-group">
						<label>Nome:</label>
						<input class="form-control" type="text" th:field="*{name}" required />
						<div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
					</div>

					<div class="form-group mt-2">
						<label>Email:</label>
						<input class="form-control" type="email" th:field="*{email}" required />
						<div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
					</div>

					<div class="form-group mt-2">
						<label>Senha:</label>
						<input class="form-control" type="password" id="senha" th:field="*{password}"
							pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{6,}$" required />
						<small class="text-muted">* A senha deve ter pelo menos uma letra maiúscula, um número e um
							caractere
							especial e no mínimo 6 caracteres, não deve conter espaços.</small>
						<div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
					</div>

					<div class="form-group mt-2">
						<label>Confirme a Senha:</label>
						<input class="form-control" type="password" id="confirmarSenha"
							pattern="^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{6,}$" required />
						<div id="erroSenhaFront" class="alert alert-danger alert-dismissible fade show mt-3 d-none"
							role="alert">
							<button type="button" class="btn-close" onclick="this.parentElement.classList.add('d-none')"
								aria-label="close"></button>
							<p id="mensagemErroFront" class="d-inline-block mb-0"></p>
						</div>
					</div>


					<div class="d-flex justify-content-center">
						<button class="btn btn-success mt-3 text-center" type="submit">Cadastrar</button>
					</div>

				</form>
				<div>
				</div>

				<a class="mt-5 mb-5 d-block text-center " href="/login">Já tem conta? Faça login</a>
			</div>

			<script>
				function validarSenhas() {
					const senha = document.getElementById('senha').value;
					const confirmarSenha = document.getElementById('confirmarSenha').value;
					const erroSenhaFront = document.getElementById('erroSenhaFront');
					const mensagemErroFront = document.getElementById('mensagemErroFront');

					if (senha !== confirmarSenha) {
						mensagemErroFront.textContent = 'As senhas não são iguais!';
						erroSenhaFront.classList.remove('d-none');
						return false; // Impede o envio
					}

					// Se as senhas forem iguais, esconde o alerta de senha (se estava aberto)
					erroSenhaFront.classList.add('d-none');
					return true;
				}
			</script>


			<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
				integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
				crossorigin="anonymous"></script>
</body>

</html>
