<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>OBlog</title>

</head>

<body class="bg-dark text-white">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h1 class="mb-5 text-center">OBlog</h1>

                <!-- Mensagem de erro -->
                <div th:if="${param.error}" class="alert alert-danger">
                    Usuário ou senha inválidos!
                </div>

                <!-- Mensagem de logout -->
                <div th:if="${param.logout}" class="alert alert-success">
                    Logout realizado com sucesso!
                </div>

                <!-- Formulário de login -->
                <form th:action="@{/login}" method="post">
                    <p class="fw-bold text-center">Login</p>
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted">Email</label>
                        <input type="email" class="form-control" id="username" name="username" required />
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-muted">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" required />
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>

                <div class="mt-3 text-center">
                    <a class="" href="/usuarios/novo">Criar conta</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
